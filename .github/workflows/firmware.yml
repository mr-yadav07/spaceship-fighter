name: ESP32 Firmware
on:
  push:
    paths:
      - "firmware/esp32-universal-ble/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/esp32-universal-ble/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32 firmware
        run: pio run -d firmware/esp32-universal-ble
      - name: Upload ESP32 firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: ESPControlStudio-ESP32-firmware
          path: firmware/esp32-universal-ble/.pio/build/esp32dev/firmware.bin
          if-no-files-found: error
