name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ESPControlStudio-GitHubBuild.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f ESPControlStudio-GitHubBuild.zip
          mkdir -p .build-src
          unzip -q ESPControlStudio-GitHubBuild.zip -d .build-src
          test -f .build-src/ESPControlStudio/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: .build-src/ESPControlStudio
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPControlStudio-debug-apk
          path: .build-src/ESPControlStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
