name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ESPControlStudio.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f ESPControlStudio.zip || { echo "ESPControlStudio.zip is missing from repository root"; exit 1; }
          unzip -q ESPControlStudio.zip -d source
          test -f source/ESPControlStudio/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: source/ESPControlStudio
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPControlStudio-debug-apk
          path: source/ESPControlStudio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
