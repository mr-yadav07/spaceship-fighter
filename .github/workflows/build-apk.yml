name: Build ESP Control Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ESPControlStudio.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          test -f ESPControlStudio.zip
          unzip -q ESPControlStudio.zip

      - name: Build debug APK
        working-directory: ESPControlStudio
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESPControlStudio-debug-apk
          path: ESPControlStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
