<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060918">
<title>Starship Fighter</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050817;color:#eef7ff;touch-action:none}body{position:relative;background:radial-gradient(ellipse at 50% 80%,#131d42 0%,#080d22 46%,#040612 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;z-index:2;inset:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px) 12px calc(env(safe-area-inset-left) + 18px);pointer-events:none}.brand{font-size:11px;font-weight:900;letter-spacing:.24em;color:#78dfff;text-shadow:0 0 14px #28baff}.scorebox{display:flex;gap:clamp(12px,4vw,34px);align-items:flex-start}.stat{text-align:right;min-width:58px}.label{font-size:9px;letter-spacing:.18em;color:#798bbd;font-weight:800}.value{font-size:clamp(17px,3vw,24px);font-weight:900;line-height:1.2;text-shadow:0 0 12px #43b9ff}.lives{color:#ff658d}.pause{pointer-events:auto;border:1px solid #4d6a9b;background:#111a36;color:#d9f6ff;border-radius:12px;padding:9px 12px;font-weight:900;letter-spacing:.1em;font-size:11px;box-shadow:0 0 18px #071529;cursor:pointer}.tip{position:absolute;z-index:2;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;text-align:center;color:#8293bd;font-size:10px;letter-spacing:.16em;font-weight:800;pointer-events:none}.overlay{position:absolute;z-index:3;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg,rgba(4,7,18,.26),rgba(4,7,18,.84));backdrop-filter:blur(2px)}.card{width:min(520px,92vw);padding:clamp(22px,5vw,42px);text-align:center;border:1px solid rgba(116,190,255,.36);border-radius:24px;background:linear-gradient(145deg,rgba(18,29,63,.94),rgba(8,12,29,.96));box-shadow:0 22px 80px #0009,0 0 50px #1c7cff22;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:-1px auto auto 20%;width:60%;height:1px;background:#8beaff;box-shadow:0 0 24px 4px #32c9ff}.eyebrow{color:#68dfff;font-size:10px;font-weight:900;letter-spacing:.34em}.title{margin:12px 0 8px;font-size:clamp(32px,8vw,58px);line-height:.96;letter-spacing:-.05em;font-weight:1000;text-transform:uppercase;text-shadow:0 0 24px #39bbff66}.title span{color:#63ddff}.subtitle{max-width:360px;margin:14px auto 24px;color:#a8b7d9;font-size:14px;line-height:1.55}.start{border:0;border-radius:13px;padding:14px 25px;background:linear-gradient(100deg,#48e0f5,#6b8dff);color:#071024;font-size:12px;font-weight:1000;letter-spacing:.16em;box-shadow:0 8px 28px #2cbbff44;cursor:pointer}.start:active,.pause:active{transform:translateY(1px)}.keys{margin-top:18px;color:#7486b3;font-size:10px;letter-spacing:.09em}.hidden{display:none}.corner{position:absolute;right:18px;bottom:18px;color:#4f6497;font-size:9px;letter-spacing:.16em}
</style>
</head>
<body>
<canvas id="game" aria-label="Starship Fighter game"></canvas>
<div class="hud"><div class="brand">✦ STARSHIP / 01</div><div class="scorebox"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">0000</div></div><div class="stat"><div class="label">WAVE</div><div class="value" id="wave">01</div></div><div class="stat"><div class="label">HULL</div><div class="value lives" id="lives">♥ ♥ ♥</div></div><button class="pause" id="pause">Ⅱ PAUSE</button></div></div>
<div class="tip" id="tip">DRAG TO PILOT · AUTO CANNONS ONLINE</div>
<div class="overlay" id="overlay"><div class="card"><div class="eyebrow">DEEP SPACE DEFENSE</div><h1 class="title">STARSHIP<br><span>FIGHTER</span></h1><p class="subtitle" id="subtitle">Pilot the last interceptor. Sweep across the screen, dodge incoming fire, and protect the frontier.</p><button class="start" id="action">START MISSION</button><div class="keys">DRAG OR USE ← → / A D TO MOVE · WEAPONS FIRE AUTOMATICALLY</div><div class="corner">MK. IV // 2088</div></div></div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),action=document.getElementById('action'),subtitle=document.getElementById('subtitle'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),livesEl=document.getElementById('lives'),pauseBtn=document.getElementById('pause'),tip=document.getElementById('tip');
let W=0,H=0,dpr=1,mode='menu',last=0,score=0,lives=3,wave=1,spawnTimer=0,fireTimer=0,shake=0,flash=0,stars=[],shots=[],enemyShots=[],enemies=[],particles=[],keys={};
const player={x:0,y:0,target:0};
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.82;if(!player.x){player.x=W/2;player.target=player.x}stars=Array.from({length:Math.max(70,Math.floor(W*H/7000))},()=>({x:Math.random()*W,y:Math.random()*H,z:.25+Math.random()*.9,r:.4+Math.random()*1.5,tw:Math.random()*6.28}));}
window.addEventListener('resize',resize);resize();
function reset(){score=0;lives=3;wave=1;spawnTimer=.5;fireTimer=.2;shake=0;shots=[];enemyShots=[];enemies=[];particles=[];player.x=W/2;player.target=player.x;updateHud();}
function updateHud(){scoreEl.textContent=String(score).padStart(4,'0');waveEl.textContent=String(wave).padStart(2,'0');livesEl.textContent=lives>0?Array.from({length:lives},()=> '♥').join(' '):'—';}
function show(title,body,button){document.querySelector('.eyebrow').textContent=title;subtitle.textContent=body;action.textContent=button;overlay.classList.remove('hidden');}
function startGame(){reset();mode='playing';overlay.classList.add('hidden');tip.textContent='DRAG TO PILOT · AUTO CANNONS ONLINE';last=performance.now();}
function pauseGame(){if(mode==='playing'){mode='paused';show('FLIGHT PAUSED','Take a breath, pilot. The frontier can wait.','RESUME MISSION');}else if(mode==='paused'){mode='playing';overlay.classList.add('hidden');last=performance.now();}}
action.addEventListener('click',()=>{if(mode==='paused')pauseGame();else startGame()});pauseBtn.addEventListener('click',()=>{if(mode==='playing'||mode==='paused')pauseGame()});
canvas.addEventListener('pointerdown',e=>{if(mode==='playing'){canvas.setPointerCapture(e.pointerId);player.target=e.clientX;player.x=player.target;}});canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&(e.buttons||e.pointerType==='touch'))player.target=e.clientX;});
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if((e.key==='Escape'||e.key.toLowerCase()==='p')&&mode==='playing')pauseGame();else if((e.key==='Escape'||e.key.toLowerCase()==='p')&&mode==='paused')pauseGame();});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function burst(x,y,color,count){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*220;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.65,max:.35+Math.random()*.65,color,r:1+Math.random()*3});}}
function spawnEnemy(){const big=Math.random()<Math.min(.28,.08+wave*.015),r=big?23:14;enemies.push({x:25+r+Math.random()*(W-50-r*2),y:-35,r,hp:big?3:1,max:big?3:1,speed:(big?58:88)+wave*8+Math.random()*28,phase:Math.random()*6.28,drift:(Math.random()-.5)*70,fire:1.2+Math.random()*1.4,big});}
function hitPlayer(){if(flash>0)return;lives--;flash=.9;shake=10;burst(player.x,player.y,'#66eaff',20);updateHud();if(lives<=0){mode='over';show('SHIP LOST','Final score: '+String(score).padStart(4,'0')+' · Wave '+String(wave).padStart(2,'0')+'. The frontier remembers your flight.','FLY AGAIN');tip.textContent='MISSION ENDED · TAP TO REDEPLOY';}}
function update(dt){for(const s of stars){s.y+=24*s.z*dt;if(s.y>H+2){s.y=-2;s.x=Math.random()*W;}}
if(mode!=='playing')return;let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);if(dir)player.target+=dir*430*dt;player.target=Math.max(28,Math.min(W-28,player.target));player.x+=(player.target-player.x)*Math.min(1,dt*12);player.y=H*.82;
wave=1+Math.floor(score/120);spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.32,1.05-(wave-1)*.055);}
fireTimer-=dt;if(fireTimer<=0){shots.push({x:player.x-8,y:player.y-24,vy:-560},{x:player.x+8,y:player.y-24,vy:-560});fireTimer=.19;}
for(const b of shots)b.y+=b.vy*dt;shots=shots.filter(b=>b.y>-20);
for(const e of enemies){e.y+=e.speed*dt;e.x+=Math.sin(performance.now()*.0015+e.phase)*e.drift*dt;e.fire-=dt;if(e.fire<=0&&e.y>20&&e.y<H*.72){enemyShots.push({x:e.x,y:e.y+e.r,vy:150+wave*10});e.fire=1.6+Math.random()*1.2;}}
enemyShots.forEach(b=>b.y+=b.vy*dt);enemyShots=enemyShots.filter(b=>b.y<H+18);
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.y>H+40){enemies.splice(i,1);continue;}for(let j=shots.length-1;j>=0;j--){const b=shots[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){shots.splice(j,1);e.hp--;burst(b.x,b.y,'#70edff',3);if(e.hp<=0){score+=e.big?35:10;burst(e.x,e.y,e.big?'#ff8c6b':'#ff4d8c',e.big?24:13);enemies.splice(i,1);updateHud();}break;}}
if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+17){enemies.splice(i,1);burst(e.x,e.y,'#ff5b89',14);hitPlayer();}}
for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];if(Math.hypot(b.x-player.x,b.y-player.y)<17){enemyShots.splice(i,1);hitPlayer();}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.12,dt);p.vy*=Math.pow(.12,dt);p.life-=dt;}particles=particles.filter(p=>p.life>0);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-28*dt);}
function drawShip(){const x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.shadowBlur=22;ctx.shadowColor='#38dfff';ctx.fillStyle='#9ff8ff';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(18,14);ctx.lineTo(7,10);ctx.lineTo(0,17);ctx.lineTo(-7,10);ctx.lineTo(-18,14);ctx.closePath();ctx.fill();ctx.shadowBlur=14;ctx.fillStyle='#346cff';ctx.beginPath();ctx.moveTo(-10,7);ctx.lineTo(-28,18);ctx.lineTo(-13,17);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(10,7);ctx.lineTo(28,18);ctx.lineTo(13,17);ctx.closePath();ctx.fill();ctx.shadowColor='#ff9a4f';ctx.fillStyle='#ffbb68';ctx.beginPath();ctx.moveTo(-5,14);ctx.lineTo(0,29+Math.random()*6);ctx.lineTo(5,14);ctx.fill();ctx.restore();}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.shadowBlur=14;ctx.shadowColor=e.big?'#ff763e':'#ff3f81';ctx.fillStyle=e.big?'#ff825f':'#ed477c';ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(e.r*.8,0);ctx.lineTo(0,-e.r);ctx.lineTo(-e.r*.8,0);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe5bc';ctx.beginPath();ctx.arc(0,0,e.big?4:3,0,Math.PI*2);ctx.fill();if(e.big){ctx.shadowBlur=0;ctx.fillStyle='#552a56';ctx.fillRect(-e.r,-e.r-9,e.r*2,3);ctx.fillStyle='#ffb34d';ctx.fillRect(-e.r,-e.r-9,e.r*2*(e.hp/e.max),3);}ctx.restore();}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#050817';ctx.fillRect(-20,-20,W+40,H+40);
let g=ctx.createRadialGradient(W*.5,H*.55,10,W*.5,H*.55,Math.max(W,H)*.7);g.addColorStop(0,'#101a3b');g.addColorStop(1,'#050817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=.25+.65*(.5+.5*Math.sin(performance.now()*.001+s.tw));ctx.fillStyle=s.z>.8?'#b5f4ff':'#8095d2';ctx.fillRect(s.x,s.y,s.r,s.r*2.2);}ctx.globalAlpha=1;
ctx.strokeStyle='#15244a';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=H*.55+i*i*17;ctx.globalAlpha=.2-i*.025;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.globalAlpha=1;
if(mode==='playing'||mode==='paused'||mode==='over'){for(const b of shots){ctx.strokeStyle='#88f5ff';ctx.lineWidth=3;ctx.shadowBlur=14;ctx.shadowColor='#32cfff';ctx.beginPath();ctx.moveTo(b.x,b.y+9);ctx.lineTo(b.x,b.y-8);ctx.stroke();}ctx.shadowBlur=0;
for(const b of enemyShots){ctx.fillStyle='#ff637f';ctx.shadowBlur=14;ctx.shadowColor='#ff375e';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;
for(const e of enemies)drawEnemy(e);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;drawShip();}
if(flash>0&&Math.floor(flash*12)%2===0){ctx.fillStyle='rgba(255,57,105,.18)';ctx.fillRect(0,0,W,H);}ctx.restore();}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop);}requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
</body>
</html>
